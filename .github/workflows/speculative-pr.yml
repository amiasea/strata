name: Speculative PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

defaults:
  run:
    working-directory: "terraform"

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: speculative-pr-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  speculative-pr:
    name: Validate and establish speculative candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Establish candidate context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKSPACE: speculative-pr-${{ github.event.pull_request.number }}
        run: |
          echo "repository=${REPOSITORY}"
          echo "pull_request=${PR_NUMBER}"
          echo "branch=${BRANCH}"
          echo "sha=${SHA}"
          echo "terraform_workspace=${WORKSPACE}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read HCP Terraform token
        shell: bash
        run: |
          TF_API_TOKEN="$(az keyvault secret show \
            --vault-name "${{ vars.SOVEREIGN_KEY_VAULT_NAME }}" \
            --name "hcp-terraform-token" \
            --query value \
            --output tsv)"

          echo "::add-mask::${TF_API_TOKEN}"
          echo "TF_API_TOKEN=${TF_API_TOKEN}" >> "$GITHUB_ENV"

      - name: Create HCP Terraform workspace
        env:
          TF_API_TOKEN: ${{ env.TF_API_TOKEN }}
          TF_ORGANIZATION: amiasea
          TF_PROJECT_ID: ${{ vars.STRATA_TFE_PROJECT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.TF_CLOUD_GITHUB_APP_INSTALLATION_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          WORKSPACE_NAME="speculative-pr-${PR_NUMBER}"

          curl \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --header "Accept: application/vnd.api+json" \
            --data "$(jq -n \
              --arg name "${WORKSPACE_NAME}" \
              --arg description "Speculative workspace for Strata pull request #${PR_NUMBER}" \
              --arg project_id "${TF_PROJECT_ID}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg branch "${GITHUB_BRANCH}" \
              --arg installation_id "${GITHUB_APP_INSTALLATION_ID}" \
              '{
                data: {
                  type: "workspaces",
                  attributes: {
                    name: $name,
                    description: $description,
                    working-directory: "terraform",
                    file-triggers-enabled: true,
                    speculative-enabled: false,
                    "vcs-repo": {
                      identifier: $repository,
                      branch: $branch,
                      "github-app-installation-id": ($installation_id | tonumber)
                    }
                  },
                  relationships: {
                    project: {
                      data: {
                        type: "projects",
                        id: $project_id
                      }
                    }
                  }
                }
              }')" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORGANIZATION}/workspaces"