name: Speculative Workspace Create

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Pull request that owns the Speculative candidate."
        required: true
        type: string
      hosting_environment_id:
        description: "Assigned Speculative Hosting environment resource ID."
        required: true
        type: string
      collective_environment_id:
        description: "Assigned Speculative Collective environment resource ID."
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  create-workspace:
    name: Create Speculative HCP Terraform workspace
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}")

          base_branch=$(echo "$response" | jq -r '.base.ref')
          head_branch=$(echo "$response" | jq -r '.head.ref')
          state=$(echo "$response" | jq -r '.state')

          if [ "$state" != "open" ]; then
            echo "Pull request #${PULL_REQUEST_NUMBER} is not open."
            exit 1
          fi

          if [ "$base_branch" != "development" ]; then
            echo "Pull request #${PULL_REQUEST_NUMBER} targets '${base_branch}', expected 'development'."
            exit 1
          fi

          echo "Pull request #${PULL_REQUEST_NUMBER} targets development."
          echo "Head branch: ${head_branch}"

          echo "head_branch=${head_branch}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_INSTITUTIVE_SUBSCRIPTION_ID }}

      - name: Read TFE token from Sovereign Key Vault
        id: secrets
        uses: azure/cli@v2
        with:
          inlineScript: |
            token=$(az keyvault secret show \
              --vault-name "kv-amiasea-sovereign" \
              --name "amiasea-tfe-org-token" \
              --query value \
              --output tsv)

            echo "::add-mask::$token"
            echo "TFE_TOKEN=$token" >> "$GITHUB_OUTPUT"

      - name: Create HCP Terraform workspace
        id: workspace
        env:
          TFE_TOKEN: ${{ steps.secrets.outputs.TFE_TOKEN }}
          TFE_ORGANIZATION: amiasea
          TFE_PROJECT_ID: ${{ vars.TFE_PROMOTION_PROJECT_ID }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          BRANCH: ${{ steps.pull-request.outputs.head_branch }}
        run: |
          workspace_name="speculative-pr-${PULL_REQUEST_NUMBER}"

          jq -n \
            --arg name "$workspace_name" \
            --arg branch "$BRANCH" \
            --arg project_id "$TFE_PROJECT_ID" \
            '{
              data: {
                type: "workspaces",
                attributes: {
                  name: $name,
                  "execution-mode": "remote",
                  "working-directory": "terraform",
                  "vcs-repo": {
                    identifier: "amiasea/strata",
                    branch: $branch,
                    "ingress-submodules": false
                  }
                },
                relationships: {
                  project: {
                    data: {
                      type: "projects",
                      id: $project_id
                    }
                  }
                }
              }
            }' > workspace.json

          response=$(curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${TFE_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --data @workspace.json \
            "https://app.terraform.io/api/v2/organizations/${TFE_ORGANIZATION}/workspaces")

          workspace_id=$(echo "$response" | jq -r '.data.id')

          test "$workspace_id" != "null"

          echo "workspace_id=$workspace_id" >> "$GITHUB_OUTPUT"

          echo "Workspace created: ${workspace_name}"
          echo "Workspace ID: ${workspace_id}"

      - name: Create workspace Terraform variables
        env:
          TFE_TOKEN: ${{ steps.secrets.outputs.TFE_TOKEN }}
          WORKSPACE_ID: ${{ steps.workspace.outputs.workspace_id }}
          HOSTING_ENVIRONMENT_ID: ${{ inputs.hosting_environment_id }}
          COLLECTIVE_ENVIRONMENT_ID: ${{ inputs.collective_environment_id }}
        run: |
          create_variable() {
            local key="$1"
            local value="$2"

            jq -n \
              --arg key "$key" \
              --arg value "$value" \
              '{
                data: {
                  type: "vars",
                  attributes: {
                    key: $key,
                    value: $value,
                    category: "terraform",
                    hcl: false,
                    sensitive: false
                  }
                }
              }' > variable.json

            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${TFE_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              --data @variable.json \
              "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/vars"
          }

          create_variable \
            "hosting_environment_id" \
            "$HOSTING_ENVIRONMENT_ID"

          create_variable \
            "collective_environment_id" \
            "$COLLECTIVE_ENVIRONMENT_ID"

      - name: Report workspace
        env:
          TFE_PROJECT_ID: ${{ vars.TFE_STRATA_PROJECT_ID }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          BRANCH: ${{ steps.pull-request.outputs.head_branch }}
          HOSTING_ENVIRONMENT_ID: ${{ inputs.hosting_environment_id }}
          COLLECTIVE_ENVIRONMENT_ID: ${{ inputs.collective_environment_id }}
          WORKSPACE_ID: ${{ steps.workspace.outputs.workspace_id }}
        run: |
          echo "Repository: amiasea/strata"
          echo "Project ID: ${TFE_PROJECT_ID}"
          echo "Pull request: #${PULL_REQUEST_NUMBER}"
          echo "Branch: ${BRANCH}"
          echo "Hosting environment: ${HOSTING_ENVIRONMENT_ID}"
          echo "Collective environment: ${COLLECTIVE_ENVIRONMENT_ID}"
          echo "Workspace ID: ${WORKSPACE_ID}"
          echo "Workspace: speculative-pr-${PULL_REQUEST_NUMBER}"